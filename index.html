<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Home</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Home">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#0b0b0d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;350;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
@font-face{
  font-family:'Outfit Local';
  src:url('outfit.ttf') format('truetype');
  font-weight:200 800;
  font-display:swap;
}
:root{
  --text:#F5F5F7;
  --text-dim:rgba(245,245,247,0.56);
  --text-muted:rgba(245,245,247,0.36);
  --focus-fill:rgba(255,255,255,0.96);
  --focus-text:#1C1C1E;
  --chip-off:rgba(255,255,255,0.12);
  --chip-set:rgba(255,255,255,0.28);
  --accent:#FFB46B;
  --accent-soft:rgba(255,180,107,0.22);
  --card-radius:22px;
  --dock-radius:22px;
  --panel-radius:28px;
  --chip-radius:999px;
  --glass-tint:rgba(255,255,255,0.10);
  --glass-dark:rgba(0,0,0,0.28);
  --hairline:rgba(255,255,255,0.10);
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  --shift-x:0px; --shift-y:0px;
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; padding:0; width:100%; height:100%; background:#0b0b0d; overscroll-behavior:none; }
body{
  font-family:'Outfit Local','Outfit',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
  user-select:none; -webkit-user-select:none;
  font-variant-numeric:tabular-nums;
}
/* Hidden haptic trigger (iOS 18+ system-tick trick via label.click() on a switch
   checkbox). Off-screen, never focusable/visible, never steals scroll/focus. */
#hapticHost{ position:fixed; left:-9999px; top:0; width:1px; height:1px; overflow:hidden; pointer-events:none; }
a{ color:inherit; text-decoration:none; }
button{ font-family:inherit; color:inherit; background:none; border:0; }
svg{ display:block; }

/* ---------- Background ---------- */
#bgSharp{
  position:fixed; inset:-2% -2% -2% -2%;
  background-size:cover; background-position:center;
  transition:background-image 600ms ease, transform 10s linear;
  transform:translate(var(--shift-x), var(--shift-y));
  will-change:transform;
}
#bgScrim{
  position:fixed; inset:0;
  background:linear-gradient(to bottom, rgba(0,0,0,0.46) 0%, rgba(0,0,0,0.20) 40%, rgba(0,0,0,0.20) 60%, rgba(0,0,0,0.42) 100%);
  pointer-events:none;
}
#nightVeil{
  position:fixed; inset:0; background:rgba(0,0,0,0.45);
  opacity:0; transition:opacity 1.2s ease; pointer-events:none;
}
body.night #nightVeil{ opacity:1; }
#nightVeil{ transition:opacity 600ms ease; }

/* Mode-change crossfade (day/night/morning) instead of a jump */
#gridRow, #bottomRow, #specialView{ transition:opacity 260ms ease; }
body.reduced-motion #nightVeil, body.reduced-motion #gridRow, body.reduced-motion #bottomRow, body.reduced-motion #specialView{ transition:none; }

/* ---------- ONE backdrop-filter element, clip-path'd to card shapes ---------- */
#glassSheet{
  position:fixed; inset:0;
  -webkit-backdrop-filter: blur(40px) saturate(125%);
  backdrop-filter: blur(40px) saturate(125%);
  pointer-events:none;
  z-index:5;
}

#stage{
  position:fixed; inset:0;
  padding: calc(26px + var(--safe-t)) calc(30px + var(--safe-r)) calc(14px + var(--safe-b)) calc(30px + var(--safe-l));
  display:flex; flex-direction:column; gap:12px;
  z-index:10;
  transform:translate(var(--shift-x), var(--shift-y));
}
#content{ flex:1; min-height:0; display:flex; flex-direction:column; gap:12px; overflow:hidden; }

.glass{
  position:relative;
  background: linear-gradient(135deg, rgba(255,255,255,0.09), rgba(255,255,255,0.02) 45%, transparent), var(--glass-tint);
  background-color: var(--glass-tint);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.0), 0 10px 30px rgba(0,0,0,0.25);
  border:1px solid var(--hairline);
}
.glass::before{
  content:''; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
  background:var(--glass-dark);
  mix-blend-mode:multiply;
  opacity:0.55;
}
.glass::after{
  content:''; position:absolute; left:0; right:0; top:0; height:26px; border-radius:inherit;
  background:linear-gradient(to bottom, rgba(255,255,255,0.55), transparent);
  opacity:0.10; pointer-events:none;
}

/* ---------- Top row ---------- */
.topRow{ display:flex; justify-content:space-between; align-items:flex-start; gap:20px; flex-shrink:0; }
.greetBlock{ min-width:0; display:flex; flex-direction:column; gap:4px; }
.clock{ font-size:clamp(56px, 9vw, 112px); font-weight:200; letter-spacing:-0.01em; line-height:1; }
.greetingRow{ display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
.greeting{ font-size:20px; font-weight:600; margin:0; }
.dateLine{ font-size:16px; font-weight:350; color:var(--text-dim); display:flex; align-items:center; gap:8px; }
.dateLine .wx{ display:inline-flex; align-items:center; gap:4px; }

.nudgeBlock{ text-align:right; max-width:46%; min-width:0; }
.nudgeTitle{ font-size:22px; font-weight:500; line-height:1.25; }
.statusRow{ display:flex; justify-content:flex-end; align-items:center; gap:8px; margin-top:6px; font-size:12px; color:var(--text-muted); }
.statusDot{ width:7px; height:7px; border-radius:50%; background:var(--text-muted); }
/* Gentle breathing while live; static when read-only/connecting. Paused (not just
   dim) after 10s with no touch, via JS toggling `animation:none` — keeps it out of
   document.getAnimations() entirely when idle, not just visually stopped. */
.statusDot.on{ background:#3DDC84; animation:dotBreathe 2s ease-in-out infinite; }
.statusDot.ro{ background:var(--text-dim); }
@keyframes dotBreathe{ 0%,100%{ opacity:1; } 50%{ opacity:0.45; } }
body.reduced-motion .statusDot.on{ animation:none; }
.keyErrHint{ font-size:12px; color:var(--text-muted); text-align:right; margin-top:4px; max-width:260px; }

/* ---------- Middle grid ---------- */
.gridRow{ display:grid; grid-template-columns: 1.25fr 1fr 1fr; gap:12px; flex:1; min-height:0; }
.card{ border-radius:var(--card-radius); padding:18px 20px; display:flex; flex-direction:column; min-height:0; overflow:hidden; }
.cardHead{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px; }
.cardTitle{ font-size:15px; font-weight:500; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-dim); display:flex; align-items:center; gap:8px; }
.cardTitle svg{ width:16px; height:16px; opacity:0.8; }
.cardSub{ font-size:11px; font-weight:400; text-transform:none; letter-spacing:0; color:var(--text-muted); }
.cardBody{
  flex:1; min-height:0; overflow-y:auto; overflow-x:hidden; display:flex; flex-direction:column;
  mask-image:linear-gradient(to bottom, black calc(100% - 20px), transparent);
  -webkit-mask-image:linear-gradient(to bottom, black calc(100% - 20px), transparent);
}
.emptyLine{ font-size:16px; color:var(--text-muted); margin:auto 0; }

/* Today timeline */
.timelineEvents{
  flex:1; position:relative; min-height:0; overflow-y:auto; display:flex; flex-direction:column; gap:8px; padding-right:2px;
  mask-image:linear-gradient(to bottom, black calc(100% - 24px), transparent);
  -webkit-mask-image:linear-gradient(to bottom, black calc(100% - 24px), transparent);
  scroll-behavior:smooth;
}
body.reduced-motion .timelineEvents{ scroll-behavior:auto; }
.pastSummary{ font-size:14px; color:var(--text-muted); padding:2px 2px 4px; flex-shrink:0; }
.nowLine{ display:flex; align-items:center; gap:8px; margin:2px 0 4px; flex-shrink:0; }
.nowLine .line{ flex:1; height:1.5px; background:var(--text); opacity:0.35; border-radius:1px; }
.nowLine .dot{ width:8px; height:8px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 4px var(--accent-soft); flex-shrink:0; }
.nowLine .label{ font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:0.1em; color:var(--text-dim); flex-shrink:0; }
.allDayChips{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
.chip{ font-size:13px; font-weight:500; padding:6px 12px; border-radius:var(--chip-radius); background:var(--chip-off); white-space:nowrap; }
.evt{ border-radius:14px; padding:10px 12px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.06); flex-shrink:0; }
.evt.current{ background:rgba(255,255,255,0.11); border-color:rgba(255,255,255,0.18); }
.evt.current .evtTitle{ font-weight:600; }
.evt.tomorrow{ background:rgba(255,255,255,0.03); }
.evt .evtTime{ font-size:12px; color:var(--text-dim); font-weight:500; text-transform:uppercase; letter-spacing:0.04em; }
.evt .evtTitle{ font-size:17px; font-weight:500; margin-top:2px; }
.evt .evtWhere{ font-size:14px; color:var(--text-dim); margin-top:1px; }
.evtBadge{ display:inline-block; font-size:11px; font-weight:600; padding:2px 8px; border-radius:999px; background:rgba(255,255,255,0.16); margin-right:6px; vertical-align:middle; }

/* Focus card */
.focusList{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px; overflow-y:auto; }
.focusList li{ display:flex; align-items:flex-start; gap:10px; font-size:17px; }
.tick{ width:20px; height:20px; border-radius:50%; border:1.6px solid rgba(255,255,255,0.4); flex-shrink:0; margin-top:2px; }
.focusSub{ font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-muted); margin:14px 0 6px; }
.remItem{ font-size:15px; color:var(--text-dim); }
.remMore{ font-size:13px; color:var(--text-muted); }

/* 11x card */
.mrrBig{ font-size:40px; font-weight:600; line-height:1; }
.mrrGoal{ font-size:16px; color:var(--text-dim); margin-left:6px; font-weight:400; }
.pctChip{ font-size:13px; font-weight:600; color:var(--text-dim); margin-top:4px; }
.progressWrap{ position:relative; margin:14px 0 6px; }
.progressTrack{ height:8px; border-radius:999px; background:rgba(255,255,255,0.12); overflow:hidden; }
.progressFill{ height:100%; border-radius:999px; background:var(--accent-soft); transition:width 600ms ease; }
.progressMarker{ position:absolute; top:-4px; width:2px; height:16px; background:rgba(255,255,255,0.5); }
.progressMarkerLabel{ position:absolute; top:14px; font-size:11px; color:var(--text-muted); transform:translateX(-50%); }
.statLine{ font-size:15px; color:var(--text-dim); margin-top:10px; display:flex; justify-content:space-between; gap:8px; }
.statLine b{ color:var(--text); font-weight:500; }
.statLineSecondary{ font-size:12px; color:var(--text-muted); margin-top:4px; }
.dotsRow{ display:flex; gap:4px; margin-top:4px; }
.dotsRow span{ width:7px; height:7px; border-radius:50%; background:rgba(255,255,255,0.14); }
.dotsRow span.filled{ background:var(--accent-soft); }
.waitingLine{ margin-top:10px; font-size:15px; font-weight:600; color:var(--text); }
.shTasks{ margin-top:10px; display:flex; flex-direction:column; gap:4px; }
.shTask{ font-size:13px; color:var(--text-dim); }

/* Bottom chips row */
.bottomRow{ display:flex; gap:12px; align-items:stretch; flex-shrink:0; }
.chipsStrip{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; flex:1; }
.countChip{ font-size:13px; font-weight:500; padding:8px 14px; border-radius:var(--chip-radius); background:var(--chip-off); }
.countChipFar{ opacity:0.55; font-size:12px; padding:6px 12px; }
.gymChip{ font-size:13px; font-weight:500; padding:8px 14px; border-radius:var(--chip-radius); background:var(--chip-off); display:flex; align-items:center; gap:6px; }
.weatherStrip{ display:flex; align-items:center; gap:14px; padding:10px 16px; border-radius:var(--chip-radius); flex-shrink:0; }
.weatherStrip .wxNow{ font-size:20px; font-weight:600; }
.weatherStrip .wxMeta{ font-size:13px; color:var(--text-dim); }
.weatherStrip .wxVerdict{ font-size:13px; color:var(--text-dim); max-width:260px; }

/* ---------- Dock ---------- */
#dock{
  height:72px; border-radius:var(--dock-radius); flex-shrink:0;
  display:flex; align-items:center; gap:3px; padding:0 5px;
  transition:opacity 300ms ease, filter 300ms ease;
  overflow-x:auto; overflow-y:hidden; -webkit-overflow-scrolling:touch; scrollbar-width:none;
}
#dock::-webkit-scrollbar{ display:none; }
#dock.readonly{ opacity:0.55; filter:grayscale(0.6); pointer-events:none; }
.dockGroup{ display:flex; align-items:center; gap:3px; height:100%; flex-shrink:0; }
.dockDivider{ width:1px; align-self:stretch; margin:16px 0; background:rgba(255,255,255,0.12); flex-shrink:0; }
.dockBtn{
  position:relative;
  min-width:44px; min-height:44px; height:52px; padding:0 7px; border-radius:16px;
  display:flex; align-items:center; justify-content:center; gap:5px;
  background:rgba(255,255,255,0.07); font-size:13px; font-weight:500;
  /* Spring back on release: transform only, GPU. Press-down below overrides
     with a snappier ease-out while the finger is down. */
  transition:transform 220ms cubic-bezier(.2,.8,.2,1.2), background 160ms ease, color 160ms ease;
  flex-shrink:0; white-space:nowrap;
}
.dockBtn svg{ width:18px; height:18px; flex-shrink:0; }
.dockBtn:active{ transform:scale(0.96); transition:transform 90ms ease-out; will-change:transform; }
.dockBtn.active{ background:var(--focus-fill); color:var(--focus-text); }
.dockBtn.pending::after{
  content:''; position:absolute; inset:-5px; border-radius:inherit; pointer-events:none;
  background:var(--accent-soft);
  animation:breatheGlow 1.6s ease-in-out infinite; will-change:opacity;
}
.dockBtn.appBtn{ flex-direction:column; gap:2px; font-size:10px; padding:0 6px; }
.appSwatch{ width:18px; height:18px; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:700; color:#fff; flex-shrink:0; line-height:1; }
/* Soft breathing glow for a pending action, not a hard opacity pulse on the button
   itself — opacity-only on a layer behind the label so text stays readable. */
@keyframes breatheGlow{ 0%,100%{ opacity:0.15; } 50%{ opacity:0.6; } }
body.reduced-motion .dockBtn.pending::after{ animation:none; opacity:0.35; }
.volGroup{ display:flex; align-items:center; gap:4px; flex-shrink:0; }
.volBar{ width:56px; height:44px; display:flex; align-items:center; position:relative; cursor:pointer; }
.volBarTrack{ width:100%; height:8px; border-radius:999px; background:rgba(255,255,255,0.14); overflow:hidden; }
.volBarFill{ height:100%; border-radius:999px; background:var(--text); transition:width 180ms ease; }
.volLabel{ font-size:12px; color:var(--text-dim); min-width:30px; text-align:center; }
body.reduced-motion .volBarFill{ transition:none; }
.roDock{ font-size:14px; color:var(--text-dim); padding:0 16px; }
body.night #dock{ opacity:0.78; }

/* More sheet: kept in flex layout always (display never toggles) so opacity/transform
   can transition; invisible + non-interactive until .open. Opens with a slide+spring,
   closes faster/linear-ish (180ms) via .closing overriding the transition duration. */
#moreSheet{
  position:fixed; inset:0; z-index:40; display:flex; align-items:flex-end; justify-content:center;
  background:rgba(0,0,0,0); opacity:0; visibility:hidden; pointer-events:none;
  transition:opacity 260ms ease, background 260ms ease, visibility 260ms ease;
}
#moreSheet.open{ opacity:1; visibility:visible; pointer-events:auto; background:rgba(0,0,0,0.5); }
#moreSheet.closing{ transition:opacity 180ms ease, background 180ms ease, visibility 180ms ease; }
.sheetPanel{
  width:min(820px, 92%); margin-bottom:calc(84px + var(--safe-b)); border-radius:var(--panel-radius);
  padding:22px 26px; max-height:70vh; overflow-y:auto;
  transform:translateY(24px); opacity:0;
  transition:transform 260ms cubic-bezier(.2,.8,.2,1.15), opacity 260ms ease;
}
#moreSheet.open .sheetPanel{ transform:translateY(0); opacity:1; }
#moreSheet.closing .sheetPanel{ transition:transform 180ms ease-in, opacity 180ms ease-in; }
body.reduced-motion #moreSheet, body.reduced-motion #moreSheet.closing,
body.reduced-motion .sheetPanel, body.reduced-motion #moreSheet.closing .sheetPanel{ transition:none; }
.sheetHead{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
.sheetHead h2{ font-size:20px; font-weight:600; margin:0; }
.sheetSection{ margin-bottom:18px; }
.sheetLabel{ font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-muted); margin-bottom:8px; }
.swatchRow{ display:flex; gap:10px; flex-wrap:wrap; }
.swatch{ width:44px; height:44px; border-radius:50%; border:2px solid rgba(255,255,255,0.2); }
.swatch.selected{ border-color:#fff; box-shadow:0 0 0 2px rgba(255,255,255,0.3); }
.sliderRow{ display:flex; align-items:center; gap:12px; }
input[type=range]{ flex:1; height:44px; }
.sliderValue{ font-size:14px; color:var(--text-dim); min-width:32px; text-align:right; }
.ambiLabel{ font-size:14px; color:var(--text-dim); margin-bottom:8px; }
.ambiNote{ font-size:12px; color:var(--text-muted); margin-top:6px; }
.pillRow{ display:flex; gap:8px; flex-wrap:wrap; }
.pillBtn{ padding:10px 16px; border-radius:999px; background:rgba(255,255,255,0.08); font-size:14px; font-weight:500; min-height:44px; }
.scrollChips{ display:flex; gap:8px; overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:4px; scrollbar-width:none; }
.scrollChips::-webkit-scrollbar{ display:none; }
.chipBtn{ flex-shrink:0; padding:10px 16px; border-radius:999px; background:rgba(255,255,255,0.08); font-size:14px; font-weight:500; min-height:44px; white-space:nowrap; }
.chipBtn.selected{ background:var(--focus-fill); color:var(--focus-text); }
.remotePad{ display:flex; flex-direction:column; align-items:center; gap:8px; max-width:280px; margin:0 auto; }
.remoteRow{ display:flex; gap:8px; align-items:center; justify-content:center; width:100%; }
.remoteRow span{ width:44px; height:44px; flex-shrink:0; }
.remoteKey{ width:44px; height:44px; min-height:44px; padding:0; display:flex; align-items:center; justify-content:center; font-size:16px; }
.remoteOk{ width:56px; }
.remoteBottom{ margin-top:6px; flex-wrap:wrap; }

/* Toast: slide-in pill from the bottom, transform+opacity only */
#toast{
  position:fixed; left:50%; bottom:calc(96px + var(--safe-b)); transform:translateX(-50%) translateY(16px);
  padding:12px 20px; border-radius:999px; font-size:14px; background:rgba(0,0,0,0.7);
  border:1px solid rgba(255,255,255,0.1); opacity:0; pointer-events:none; transition:opacity 220ms ease, transform 220ms ease;
  z-index:50; will-change:auto;
}
#toast.show{ opacity:1; transform:translateX(-50%) translateY(0); will-change:transform,opacity; }
body.reduced-motion #toast{ transition:none; }

/* Special full-screen view: Morning / Night */
.specialView{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:14px; padding:20px; }
.svBig{ font-size:clamp(22px,3vw,30px); font-weight:500; }
.svLine{ font-size:18px; color:var(--text-dim); }
.svCalm{ color:var(--text-muted); font-size:15px; margin-top:6px; }
.svKit{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
.kitChip{ font-size:14px; padding:6px 14px; border-radius:999px; background:var(--chip-off); }

/* Phone compact "now" card */
.phoneNow{ display:none; }
.pnTime{ font-size:34px; font-weight:300; }
.pnLine{ font-size:15px; color:var(--text-dim); margin-top:4px; }

/* Portrait */
body.portrait .gridRow{ grid-template-columns:1fr; grid-template-rows:auto auto auto; }
body.portrait .bottomRow{ flex-wrap:wrap; }
body.portrait #dock{ height:auto; flex-wrap:wrap; padding:10px; }

/* ---------- Phone (<600px): iPhone 13 390x844, compact "now" card first, then dock, then content ---------- */
body.phone #stage{ overflow-y:auto; -webkit-overflow-scrolling:touch; height:auto; min-height:100%; padding-bottom: calc(24px + var(--safe-b)); }
body.phone .topRow{ order:0; }
body.phone .phoneNow{ display:block; order:1; padding:16px 18px; }
body.phone #dock{ order:2; }
body.phone #content{ order:3; flex:none; overflow:visible; }
body.phone .nudgeBlock{ max-width:56%; }
body.phone .clock{ font-size:min(15vw,56px); }
body.phone .greeting{ font-size:20px; }

/* No reliance on display:contents (unsupported on this WebKit build — falls back to
   the group's own display:flex, which breaks a shared 2-col grid). Instead each
   .dockGroup wraps its own buttons at ~50% width, giving the same 2-column feel
   without needing items to escape their group container. */
body.phone #dock{
  display:flex; flex-direction:column; flex-wrap:nowrap; gap:8px; height:auto; padding:14px;
  overflow-x:hidden; overflow-y:auto;
}
body.phone .dockGroup{ display:flex; flex-wrap:wrap; gap:8px; width:100%; height:auto; }
body.phone .dockDivider{ display:none; }
body.phone .dockBtn{ flex:1 1 calc(50% - 4px); width:auto; height:56px; min-height:56px; justify-content:center; }

/* First-load stagger (cards fade up once, transform+opacity only) */

.card.firstLoadIn{ animation:fadeUpIn 320ms cubic-bezier(.2,.8,.2,1) both; }
body.reduced-motion .card.firstLoadIn{ animation:none; }
</style>

<body>

<div id="toast"></div>
<video id="keepawake" src="awake.mp4" muted playsinline loop></video>

<script>
(function(){
"use strict";

/* ================= Config ================= */
var GIST_ID = '';
var GIST_FILES = ['rem','sh','cal','today','tonight'];
function gistUrl(file){ return 'https://gist.githubusercontent.com/ht7437462-beep/' + GIST_ID + '/raw/' + file + '.json?t=' + Date.now(); }

var qs = new URLSearchParams(location.search);
var NOW_OVERRIDE = qs.get('now'); // ISO string, for tests
function nowDate(){ return NOW_OVERRIDE ? new Date(NOW_OVERRIDE) : new Date(); }

var REDUCED_MOTION = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if(REDUCED_MOTION) document.body.classList.add('reduced-motion');

var ROOM_COLOURS = {
  warm:'#FFB46B', cool:'#DCE8FF', red:'#FF2D2D', purple:'#A64DFF', blue:'#3D7CFF', green:'#3DDC84', graphite:'#8A8A8E'
};
var SWATCH_ORDER = ['warm','cool','red','purple','blue','green'];

var COUNTDOWN_DEFAULTS = [
  {what:'Business Show', date:'2026-11-11'},
  {what:'Driving test', date:'2027-01-05'},
  {what:'A-levels', date:'2027-05-11'},
  {what:'11x goal', date:'2027-06-30'}
];

var AMBI_STYLES = ['Warm White','Cool white','Hot lava','Deep water','Fresh nature','Lounge light','Standard','Natural','Vivid','Game'];

/* ================= Haptics =================
   Safari on iOS has no navigator.vibrate. The working trick on iOS 18+: a hidden
   <label><input type="checkbox" switch></label> — calling label.click() fires the
   system haptic tick. Silent no-op on iPad (no Taptic engine) and everywhere else;
   feature-detected and wrapped so it can never throw or steal focus/scroll. */
var hapticLabel = null;
function setupHaptic(){
  try{
    var label = document.createElement('label');
    label.id = 'hapticHost';
    label.setAttribute('aria-hidden', 'true');
    var input = document.createElement('input');
    input.type = 'checkbox';
    input.setAttribute('switch', '');
    input.tabIndex = -1;
    input.setAttribute('aria-hidden', 'true');
    label.appendChild(input);
    document.body.appendChild(label);
    hapticLabel = label;
  }catch(e){ hapticLabel = null; }
}
function hapticTick(){
  if(!hapticLabel) return;
  try{ hapticLabel.click(); }catch(e){}
}
/* kind: 'tap' | 'confirm' | 'step' (one tick) | 'error' (two ticks, 90ms apart).
   Dispatches a DOM event alongside the real tick so tests can observe it without
   touching the hidden element. Never throws. */
function haptic(kind){
  try{ document.dispatchEvent(new CustomEvent('haptic:tick', {detail:{kind:kind||'tap'}})); }catch(e){}
  try{
    if(kind === 'error'){ hapticTick(); setTimeout(hapticTick, 90); }
    else hapticTick();
  }catch(e){}
}

/* Status dot: breathes gently while live, pauses (fully, not just dimmed) after
   10s with no touch — keeps it out of document.getAnimations() when idle. */
var dotIdleTimer = null;
function noteActivity(){
  try{
    var dot = document.getElementById('statusDot');
    if(dot) dot.style.animation = '';
    clearTimeout(dotIdleTimer);
    dotIdleTimer = setTimeout(function(){
      var d = document.getElementById('statusDot');
      if(d) d.style.animation = 'none';
    }, 10000);
  }catch(e){}
}

/* ---------- Count a number up to a new value (short-lived rAF, self-terminating;
   never a standing idle loop) ---------- */
function animateCount(el, newVal, suffix, duration){
  if(!el) return;
  suffix = suffix || '';
  var prev = parseFloat(el.dataset.cnt);
  if(isNaN(prev)) prev = newVal;
  if(REDUCED_MOTION || prev === newVal){
    el.textContent = newVal + suffix;
    el.dataset.cnt = newVal;
    return;
  }
  var start = null;
  function step(ts){
    if(start === null) start = ts;
    var p = Math.min(1, (ts - start) / duration);
    var v = Math.round(prev + (newVal - prev) * p);
    el.textContent = v + suffix;
    if(p < 1) requestAnimationFrame(step);
    else el.dataset.cnt = newVal;
  }
  requestAnimationFrame(step);
}

/* ---------- Crossfade text content on refresh instead of popping (opacity only) --- */
function crossfadeSet(el, html, after){
  if(!el) return;
  if(el.innerHTML === html){ if(after) after(); return; }
  if(REDUCED_MOTION){ el.innerHTML = html; if(after) after(); return; }
  el.style.transition = 'opacity 60ms ease';
  el.style.opacity = '0';
  setTimeout(function(){
    el.innerHTML = html;
    el.style.opacity = '1';
    if(after) after();
  }, 60);
}

function hexToRgba(hex, a){
  if(!hex) return 'rgba(255,255,255,'+a+')';
  hex = String(hex).replace('#','');
  if(hex.length===3) hex = hex.split('').map(function(c){ return c+c; }).join('');
  var r=parseInt(hex.substr(0,2),16), g=parseInt(hex.substr(2,2),16), b=parseInt(hex.substr(4,2),16);
  if(isNaN(r)||isNaN(g)||isNaN(b)) return 'rgba(255,255,255,'+a+')';
  return 'rgba('+r+','+g+','+b+','+a+')';
}

/* ================= State ================= */
var S = {
  mode: 'connecting', // connecting | live | readonly
  tv: null, ambi: null, room: null, lights: null, last: null, weather: null,
  feeds: { rem:null, sh:null, cal:null, today:null, tonight:null },
  tsFeeds: {}, // per-feed fetch timestamp for staleness
  stateTs: null,
  pendingAction: null
};

var isLiveHost = !(location.hostname === '' || location.protocol === 'file:' || /github\.io$/.test(location.hostname));
var es = null, liveFailSince = null, lastLiveOkAt = null;
var liveBackoffIdx = 0;
var LIVE_BACKOFFS = [1000,2000,5000,10000];

/* ================= Boot ================= */
function boot(){
  applyOrientationClass();
  window.addEventListener('resize', applyOrientationClass);
  window.addEventListener('orientationchange', applyOrientationClass);

  setupHaptic();
  try{ window.__haptic = haptic; }catch(e){} // test hook only; real calls always go through haptic()
  ['pointerdown','touchstart','click'].forEach(function(t){
    document.addEventListener(t, noteActivity, {passive:true});
  });
  noteActivity();
  runFirstLoadStagger();

  startClock();
  startBurnInShift();
  wireDock();
  wireKeepAwake();

  var stageEl = document.getElementById('stage');
  var maskRaf = null;
  stageEl.addEventListener('scroll', function(){
    if(maskRaf) return;
    maskRaf = requestAnimationFrame(function(){ maskRaf=null; rebuildGlassMask(); });
  }, {passive:true});

  var fragId = (location.hash.match(/g=([a-f0-9]+)/) || [])[1];
  try { if(fragId) localStorage.setItem('gistId', fragId); else if(!GIST_ID) fragId = localStorage.getItem('gistId') || ''; } catch(e){}
  if(fragId) GIST_ID = fragId;

  connectLive();
  pollWeather();
  setInterval(pollWeather, 20*60*1000);

  document.addEventListener('visibilitychange', function(){ if(!document.hidden) reconnectAll(); });
  window.addEventListener('pageshow', reconnectAll);
  window.addEventListener('online', reconnectAll);
}

function reconnectAll(){
  connectLive();
}

/* ================= Live mode (EventSource + poll) ================= */
function connectLive(){
  if(!isLiveHost){ fallbackToReadOnly(); return; }
  try{
    if(es){ try{ es.close(); }catch(e){} }
    es = new EventSource('/api/events');
    es.addEventListener('state', function(ev){
      try{
        var data = JSON.parse(ev.data);
        onLiveState(data);
      }catch(e){}
    });
    es.onerror = function(){
      // Close immediately so the browser's own internal EventSource reconnect timer
      // doesn't also fire and race our manual backoff below (two reconnect drivers
      // fighting each other was evicting good connections on the server side).
      try{ if(es) es.close(); }catch(e){}
      es = null;
      if(!liveFailSince) liveFailSince = Date.now();
      scheduleLiveRetry();
    };
    es.onopen = function(){ liveFailSince = null; liveBackoffIdx = 0; };
  }catch(e){
    fallbackToReadOnly();
  }
  // also poll /api/state every 5s as a belt-and-braces
  if(window._statePoll) clearInterval(window._statePoll);
  window._statePoll = setInterval(pollState, 5000);
  pollState();
}

var pollStateInFlight = false;
function pollState(){
  if(!isLiveHost || pollStateInFlight) return;
  pollStateInFlight = true;
  fetch('/api/state', {cache:'no-store', signal:AbortSignal.timeout(4000)}).then(function(r){
    if(!r.ok) throw new Error('bad status');
    return r.json();
  }).then(function(data){
    onLiveState(data);
  }).catch(function(){
    if(!liveFailSince) liveFailSince = Date.now();
    checkLiveTimeout();
  }).finally(function(){ pollStateInFlight = false; });
}

function scheduleLiveRetry(){
  checkLiveTimeout();
  var delay = LIVE_BACKOFFS[Math.min(liveBackoffIdx, LIVE_BACKOFFS.length-1)];
  liveBackoffIdx++;
  setTimeout(function(){
    if(S.mode !== 'live') connectLive();
  }, delay);
}

function checkLiveTimeout(){
  if(liveFailSince && (Date.now() - liveFailSince) > 8000){
    fallbackToReadOnly();
  }
}

function onLiveState(data){
  liveFailSince = null;
  lastLiveOkAt = Date.now();
  S.mode = 'live';
  S.tv = data.tv || null;
  S.ambi = data.ambi || null;
  S.room = data.room || null;
  S.lights = data.lights || null;
  S.last = data.last || null;
  // Page's own open-meteo poll wins; the TV's cached weather (different field shape)
  // is only a fallback until the page has its own, so it never clobbers the real one.
  if(!S.weather) S.weather = data.weather || null;
  S.stateTs = data.ts || Date.now();
  if(data.feeds){
    GIST_FILES.forEach(function(f){
      if(data.feeds[f] !== undefined && data.feeds[f] !== null){
        S.feeds[f] = data.feeds[f];
      }
    });
  }
  render();
  // start trying every 10s in background is implicit via poll/SSE already running
}

/* ================= Read-only mode (gist) ================= */
var roTimer = null;
function fallbackToReadOnly(){
  if(S.mode === 'readonly') { pollGistIfDue(); return; }
  S.mode = 'readonly';
  S.tv = null; S.ambi = null; S.room = null; S.lights = null;
  pollGistIfDue();
  if(roTimer) clearInterval(roTimer);
  roTimer = setInterval(pollGistIfDue, 60000);
  // keep trying the TV every 10s
  if(isLiveHost && window._tvRetry) clearInterval(window._tvRetry);
  if(isLiveHost){
    window._tvRetry = setInterval(function(){
      fetch('/api/state', {cache:'no-store', signal:AbortSignal.timeout(4000)}).then(function(r){ if(r.ok) return r.json(); throw 0; })
        .then(function(data){ clearInterval(window._tvRetry); onLiveState(data); })
        .catch(function(){});
    }, 10000);
  }
  render();
}

function pollGistIfDue(){
  GIST_FILES.forEach(function(file){
    fetch(gistUrl(file), {signal:AbortSignal.timeout(6000)}).then(function(r){ return r.json(); }).then(function(data){
      S.feeds[file] = data;
      S.tsFeeds[file] = Date.now();
      S.stateTs = Date.now();
      render();
    }).catch(function(){ /* leave stale data, missing hides lines */ });
  });
}

/* ================= Weather ================= */
function pollWeather(){
  var base = 'https://api.open-meteo.com/v1/forecast?latitude=50.968&longitude=-1.352&hourly=temperature_2m,apparent_temperature,precipitation_probability,wind_speed_10m,wind_gusts_10m,weather_code&timezone=Europe%2FLondon';
  fetch(base + '&models=ukmo_seamless', {signal:AbortSignal.timeout(6000)}).then(function(r){
    if(!r.ok) throw 0; return r.json();
  }).catch(function(){
    return fetch(base + '&models=best_match', {signal:AbortSignal.timeout(6000)}).then(function(r){ return r.json(); });
  }).then(function(data){
    S.weather = data; render();
  }).catch(function(){ /* leave weather strip hidden */ });
}

/* ================= Clock / greeting / date ================= */
function startClock(){ tickClock(); setInterval(tickClock, REDUCED_MOTION ? 10000 : 1000); }
function pad(n){ return (n<10?'0':'')+n; }
var lastMinuteBucket = null;
function tickClock(){
  var d = nowDate();
  document.getElementById('clock').textContent = pad(d.getHours()) + ':' + pad(d.getMinutes());
  document.getElementById('dateLine').innerHTML = dateLineHtml(d);
  document.getElementById('greeting').textContent = greetingFor(d);
  var wasNight = document.body.classList.contains('night');
  var wasMorning = document.body.classList.contains('morning');
  applyDayNightMode(d);
  var isNight = document.body.classList.contains('night');
  var isMorning = document.body.classList.contains('morning');
  var bucket = d.getHours()*60 + d.getMinutes();
  if(wasNight !== isNight || wasMorning !== isMorning){
    render();
  } else if(bucket !== lastMinuteBucket){
    // Re-group Today's past/current/upcoming (and refresh the night/morning view)
    // once a minute even without new feed data, since "now" keeps moving.
    if(isNight) renderNight();
    else if(isMorning) renderMorning();
    else renderToday();
  }
  lastMinuteBucket = bucket;
}
function greetingFor(d){
  var h = d.getHours();
  if(h>=23 || h<5) return 'Still up, Harry?';
  if(h>=21) return 'Evening, Harry';
  var part = h < 12 ? 'morning' : h < 17 ? 'afternoon' : 'evening';
  return 'Good ' + part + ', Harry';
}
function dateLineHtml(d){
  var days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var mons=['January','February','March','April','May','June','July','August','September','October','November','December'];
  var s = days[d.getDay()] + ' ' + d.getDate() + ' ' + mons[d.getMonth()];
  if(S.weather) s += ' <span class="wx">· ' + weatherNowVerdictShort() + '</span>';
  return s;
}
function weatherNowVerdictShort(){
  try{
    var hrs = S.weather.hourly;
    var idx = nearestHourIdx(hrs.time);
    if(idx<0) return '';
    var t = Math.round(hrs.temperature_2m[idx]);
    return t + '° ' + wxCodeLabel(hrs.weather_code[idx]);
  }catch(e){ return ''; }
}
function nearestHourIdx(times){
  var n = nowDate().getTime();
  var best=-1, bestDiff=Infinity;
  for(var i=0;i<times.length;i++){
    var diff = Math.abs(new Date(times[i]).getTime() - n);
    if(diff<bestDiff){ bestDiff=diff; best=i; }
  }
  return best;
}
function wxCodeLabel(code){
  if(code===0) return 'Clear';
  if(code<=3) return 'Cloudy';
  if(code<=48) return 'Foggy';
  if(code<=67) return 'Rain';
  if(code<=77) return 'Snow';
  if(code<=82) return 'Showers';
  if(code<=86) return 'Snow showers';
  return 'Stormy';
}

/* ================= Day / night mode ================= */
function applyDayNightMode(d){
  var h = d.getHours();
  var night = (h>=21) || (h<5);
  document.body.classList.toggle('night', night);
  var morning = (h>=5 && h<10);
  document.body.classList.toggle('morning', morning);
}

/* ================= Orientation ================= */
function applyOrientationClass(){
  var portrait = window.innerHeight > window.innerWidth;
  document.body.classList.toggle('portrait', portrait);
  document.body.classList.toggle('phone', window.innerWidth < 600);
  requestAnimationFrame(rebuildGlassMask);
}

/* ================= Burn-in shift ================= */
function startBurnInShift(){
  function shift(){
    var x = (Math.random()*8-4).toFixed(1);
    var y = (Math.random()*8-4).toFixed(1);
    if(REDUCED_MOTION){ x=0; y=0; }
    document.documentElement.style.setProperty('--shift-x', x+'px');
    document.documentElement.style.setProperty('--shift-y', y+'px');
  }
  shift();
  setInterval(shift, 10*60*1000);
}

/* ================= Keep awake ================= */
function wireKeepAwake(){
  var v = document.getElementById('keepawake');
  function play(){ v.play().catch(function(){}); }
  document.addEventListener('touchstart', play, {once:false, passive:true});
  document.addEventListener('click', play);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) play(); });
  play();
}

/* ================= First-load stagger ================= */
var firstLoadRan = false;
function runFirstLoadStagger(){
  if(firstLoadRan) return;
  firstLoadRan = true;
  if(REDUCED_MOTION) return;
  var cards = document.querySelectorAll('.card');
  cards.forEach(function(c, i){
    c.style.animationDelay = (i * 40) + 'ms';
    c.classList.add('firstLoadIn');
  });
  setTimeout(function(){
    cards.forEach(function(c){ c.classList.remove('firstLoadIn'); c.style.animationDelay = ''; });
  }, cards.length * 40 + 320 + 60);
}

/* ================= Render orchestrator ================= */
var lastSpecialState = null; // null = not yet decided (no crossfade on first render)
function fillGridContent(){
  renderToday();
  renderFocus();
  render11x();
  renderChipsStrip();
  renderWeatherStrip();
}
function fillSpecialContent(isNight, isMorning){
  if(isNight) renderNight(); else if(isMorning) renderMorning();
}
function render(){
  renderStatus();
  renderBackground();
  renderNudge();
  renderKeyErr();
  var isNight = document.body.classList.contains('night');
  var isMorning = document.body.classList.contains('morning');
  var wantSpecial = isNight || isMorning;
  var gridRow = document.getElementById('gridRow');
  var bottomRow = document.getElementById('bottomRow');
  var special = document.getElementById('specialView');

  if(lastSpecialState !== null && wantSpecial !== lastSpecialState && !REDUCED_MOTION){
    // Day <-> night/morning: a 600ms crossfade of the layout instead of a jump —
    // fade the current view out, swap display+content, fade the new one in.
    var fadeEls = [gridRow, bottomRow, special];
    fadeEls.forEach(function(el){ el.style.opacity = '0'; });
    setTimeout(function(){
      gridRow.style.display = wantSpecial ? 'none' : '';
      bottomRow.style.display = wantSpecial ? 'none' : '';
      special.style.display = wantSpecial ? 'flex' : 'none';
      if(wantSpecial) fillSpecialContent(isNight, isMorning); else fillGridContent();
      requestAnimationFrame(function(){ fadeEls.forEach(function(el){ el.style.opacity = '1'; }); });
    }, 260);
  } else {
    gridRow.style.display = wantSpecial ? 'none' : '';
    bottomRow.style.display = wantSpecial ? 'none' : '';
    special.style.display = wantSpecial ? 'flex' : 'none';
    if(wantSpecial) fillSpecialContent(isNight, isMorning); else fillGridContent();
  }
  lastSpecialState = wantSpecial;
  renderPhoneNow();
  renderDock();
  requestAnimationFrame(rebuildGlassMask);
}

function renderStatus(){
  var dot = document.getElementById('statusDot');
  var txt = document.getElementById('statusText');
  dot.className = 'statusDot';
  if(S.mode==='live'){ dot.classList.add('on'); txt.textContent='live'; }
  else if(S.mode==='readonly'){ dot.classList.add('ro'); txt.textContent='read-only'; }
  else { txt.textContent='connecting'; }
  var newestTs;
  if(S.mode === 'readonly'){
    newestTs = 0;
    Object.keys(S.tsFeeds).forEach(function(k){ newestTs = Math.max(newestTs, S.tsFeeds[k]); });
  } else {
    newestTs = S.stateTs || 0;
  }
  var age = Date.now() - newestTs;
  if(newestTs && age > 20*60*1000){
    var d = new Date(newestTs);
    txt.textContent += ' · updated ' + pad(d.getHours())+':'+pad(d.getMinutes());
  }
}

function currentRoomColour(){
  if(S.room && S.room.rgb) return S.room.rgb;
  if(S.room && S.room.name && ROOM_COLOURS[S.room.name]) return ROOM_COLOURS[S.room.name];
  return ROOM_COLOURS.graphite;
}
function currentRoomName(){
  if(S.room && S.room.name && ROOM_COLOURS[S.room.name]) return S.room.name;
  return 'graphite';
}
var lastBgRoom = null;
function renderBackground(){
  var room = currentRoomName();
  if(room === lastBgRoom) return;

/* ---------- Today timeline ---------- */
function renderToday(){
  var el = document.getElementById('todayBody');
  var cal = S.feeds.cal;
  var tomorrowFlag = document.getElementById('tomorrowFlag');
  if(!cal || !cal.events || !cal.events.length){
    el.innerHTML = '<div class="emptyLine">Nothing booked today</div>';
    tomorrowFlag.style.display = 'none';
    return;
  }
  var now = nowDate();
  var dayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  var dayEnd = new Date(dayStart.getTime() + 24*3600*1000);
  var events = cal.events.map(function(e){
    return { title:e.title, where:e.where, cal:e.cal, allDay:!!e.allDay, start:new Date(e.start), end:new Date(e.end) };
  });
  var todays = events.filter(function(e){ return !e.allDay && e.start < dayEnd && e.end > dayStart; });
  var allDayToday = events.filter(function(e){ return e.allDay && e.start < dayEnd && e.end > dayStart; });

  var showingTomorrow = false;
  var dayEvents = todays;
  if(!dayEvents.length){
    var tmrStart = dayEnd, tmrEnd = new Date(dayEnd.getTime()+24*3600*1000);
    dayEvents = events.filter(function(e){ return !e.allDay && e.start < tmrEnd && e.end > tmrStart; });
    showingTomorrow = dayEvents.length > 0;
  }
  // Home-calendar items only within next 3h
  dayEvents = dayEvents.filter(function(e){
    if(e.cal !== 'Home') return true;
    var diffH = (e.start.getTime() - now.getTime())/3600000;
    return diffH <= 3;
  });

  tomorrowFlag.style.display = showingTomorrow ? '' : 'none';

  if(!dayEvents.length && !allDayToday.length){
    el.innerHTML = '<div class="emptyLine">Nothing booked today</div>';
    return;
  }
  dayEvents.sort(function(a,b){ return a.start-b.start; });

  // Lay out so NOW is always visible: past collapses to one dim "N done" line,
  // the current/next event is highlighted, upcoming follows — never a time-proportional
  // position against a non-proportional list (that never lined up right).
  var past = [], current = null, upcoming = [];
  dayEvents.forEach(function(e){
    if(showingTomorrow){ upcoming.push(e); return; }
    if(e.end <= now) past.push(e);
    else if(e.start <= now && e.end > now) current = e;
    else upcoming.push(e);
  });

  var html = '';
  if(allDayToday.length){
    html += '<div class="allDayChips">' + allDayToday.map(function(e){
      return '<span class="chip">'+esc(e.title)+'</span>';
    }).join('') + '</div>';
  }
  html += '<div class="timelineEvents" id="timelineEvents">';
  var dayOver = !showingTomorrow && !current && !upcoming.length;
  if(past.length && !dayOver){
    html += '<div class="pastSummary">'+past.length+' done</div>';
  }
  if(!showingTomorrow && !dayOver){
    html += '<div class="nowLine"><span class="line"></span><span class="dot"></span><span class="label">Now</span><span class="line"></span></div>';
  }
  if(current) html += evtHtml(current, true, showingTomorrow);
  upcoming.forEach(function(e){ html += evtHtml(e, false, showingTomorrow); });
  if(!current && !upcoming.length && !showingTomorrow){
    var t0 = dayEnd, t1 = new Date(dayEnd.getTime()+24*3600*1000);
    var tmr = events.filter(function(e){ return !e.allDay && e.cal !== 'Home' && e.start >= t0 && e.start < t1; })
      .sort(function(a,b){ return a.start-b.start; }).slice(0,4);
    if(tmr.length){
      tomorrowFlag.style.display = '';
      tmr.forEach(function(e, i){ html += evtHtml(e, i===0, true); });
    } else {
      html += '<div class="emptyLine" style="margin:8px 0;">Nothing left today</div>';
    }
  }
  html += '</div>';
  crossfadeSet(el, html, scrollToCurrent);
}
function evtHtml(e, isCurrent, showingTomorrow){
  var cls = 'evt' + (isCurrent?' current':'') + (showingTomorrow?' tomorrow':'');
  var timeLabel = (showingTomorrow ? 'Tomorrow ' : '') + pad(e.start.getHours())+':'+pad(e.start.getMinutes());
  var h = '<div class="'+cls+'">';
  h += '<div class="evtTime"><span class="evtBadge">'+esc(e.cal||'')+'</span>'+timeLabel+'</div>';
  h += '<div class="evtTitle">'+esc(e.title)+'</div>';
  if(e.where) h += '<div class="evtWhere">'+esc(e.where)+'</div>';
  h += '</div>';
  return h;
}
function scrollToCurrent(){
  var container = document.getElementById('timelineEvents');
  if(!container) return;
  var target = container.querySelector('.evt.current') || container.querySelector('.nowLine');
  if(!target) return;
  var top = Math.max(0, target.offsetTop - 16);
  if(REDUCED_MOTION) container.scrollTop = top;
  else { try{ container.scrollTo({top:top, behavior:'smooth'}); }catch(e){ container.scrollTop = top; } }
}

/* ---------- Shared helpers for Morning / Night / phone "now" ---------- */
function firstCollegeOrWorkTomorrow(){
  var cal = S.feeds.cal;
  if(!cal || !cal.events) return null;
  var now = nowDate();
  var tmrStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()+1);
  var tmrEnd = new Date(tmrStart.getTime()+24*3600*1000);
  var evs = cal.events.filter(function(e){
    if(e.allDay) return false;
    if(e.cal!=='College' && e.cal!=='Work') return false;
    var s = new Date(e.start);
    return s>=tmrStart && s<tmrEnd;
  }).sort(function(a,b){ return new Date(a.start)-new Date(b.start); });
  if(!evs.length) return null;
  var e = evs[0], s = new Date(e.start);
  return 'Tomorrow ' + pad(s.getHours())+':'+pad(s.getMinutes()) + ' · ' + e.title + (e.where?', '+e.where:'');
}
function firstEventTodayFrom(cal, now){
  if(!cal || !cal.events) return null;
  var dayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  var dayEnd = new Date(dayStart.getTime()+24*3600*1000);
  var evs = cal.events.filter(function(e){ return !e.allDay && new Date(e.start) < dayEnd && new Date(e.end) > dayStart; })
    .map(function(e){ return {title:e.title, where:e.where, cal:e.cal, start:new Date(e.start), end:new Date(e.end)}; })
    .sort(function(a,b){ return a.start-b.start; });
  return evs.length ? evs[0] : null;
}
function travelMinutesFor(evt){
  if(evt && evt.cal === 'College') return 25;
  return 20;
}
function nextUpcomingEvent(){
  var cal = S.feeds.cal;
  if(!cal || !cal.events) return null;
  var now = nowDate();
  var evs = cal.events.filter(function(e){ return !e.allDay && new Date(e.end) > now; })
    .map(function(e){ return {title:e.title, where:e.where, start:new Date(e.start)}; })
    .sort(function(a,b){ return a.start-b.start; });
  return evs.length ? evs[0] : null;
}
function morningRideVerdict(){
  if(!S.weather) return '';
  try{
    var hrs = S.weather.hourly;
    var idx = nearestHourIdx(hrs.time);
    if(idx<0) return '';
    var span = hrs.temperature_2m.slice(idx, idx+10);
    var rainVals = (hrs.precipitation_probability||[]).slice(idx, idx+10);
    var windVals = (hrs.wind_gusts_10m || hrs.wind_speed_10m || []).slice(idx, idx+10);
    var t = Math.min.apply(null, span);
    var rain = rainVals.length ? Math.max.apply(null, rainVals) : null;
    var wind = windVals.length ? Math.max.apply(null, windVals) : null;
    return weatherVerdict(t, rain, wind);
  }catch(e){ return ''; }
}

function renderWeatherStrip(){
  var el = document.getElementById('weatherStrip');
  if(!S.weather){ el.style.display='none'; return; }
  try{
    var hrs = S.weather.hourly;
    var idx = nearestHourIdx(hrs.time);

    var now = Math.round(hrs.temperature_2m[idx]);
    var feels = hrs.apparent_temperature ? Math.round(hrs.apparent_temperature[idx]) : now;
    var rain = hrs.precipitation_probability ? hrs.precipitation_probability[idx] : null;
    var windSrc = hrs.wind_gusts_10m || hrs.wind_speed_10m;
    var wind = windSrc ? Math.round(windSrc[idx]) : null;
    var dayVals = hrs.temperature_2m.slice(idx, idx+15);
    var hi = Math.round(Math.max.apply(null, dayVals));
    var lo = Math.round(Math.min.apply(null, dayVals));
    var verdict = weatherVerdict(now, rain, wind);

      '<span class="wxNow">'+now+'°</span>' +
      (feels!==now ? '<span class="wxMeta">feels '+feels+'°</span>' : '') +
      '<span class="wxMeta">'+lo+'° → '+hi+'°' + (rain!==null?' · '+rain+'% rain':'') + (wind!==null?' · '+wind+'mph':'') + '</span>' +
      '<span class="wxVerdict">'+esc(verdict)+'</span>';
    el.style.display='flex';
  }catch(e){ el.style.display='none'; }
}
function weatherVerdict(t, rain, wind){
  if(rain!==null && rain>=50) return 'Wet ride home, pack waterproofs';
  if(t<=4) return 'Cold, thermals and winter gloves';
  if(wind!==null && wind>=25) return 'Windy, mind the gusts';
  if(t>=18) return 'Mild, light layers fine';
  return 'Mild, a jacket will do';
}

    gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/>'
  };
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6">'+(icons[name]||'')+'</svg>';
}

function wireDock(){
  document.getElementById('dockPower').innerHTML =
    btnHtml('power','Power', svgIcon('power')) +
    btnHtml('wake','Wake', svgIcon('wake')) +
    btnHtml('night','Night', svgIcon('night')) +
    btnHtml('standby','Standby', svgIcon('standby'));

  document.getElementById('dockVol').innerHTML =
    '<button class="dockBtn" data-action="volume_down" data-v="2">−</button>' +
    '<div class="volBar" id="volBar"><div class="volBarTrack"><div class="volBarFill" id="volBarFill" style="width:0%"></div></div></div>' +
    '<span class="volLabel" id="volLabel">—</span>' +
    '<button class="dockBtn" data-action="volume_up" data-v="2">+</button>';

  document.getElementById('dockApps').innerHTML =
    appBtnHtml('netflix','Netflix') + appBtnHtml('youtube','YouTube') + appBtnHtml('spotify','Spotify') +
    appBtnHtml('prime','Prime') + liveBtnHtml() + consoleBtnHtml();

  document.getElementById('dockExtra').innerHTML =
    '<button class="dockBtn" data-action="lights_power" id="lightsBtn">'+svgIcon('bulb')+'<span>Lights</span></button>' +
    '<button class="dockBtn" data-open="scenes">Scenes ▾</button>' +
    '<button class="dockBtn" data-open="more">More ▾</button>';

  document.getElementById('volBar').addEventListener('click', function(){ haptic('tap'); doAction('mute', null, this); });

  document.body.addEventListener('click', function(e){
    var btn = e.target.closest('[data-action]');
    if(btn && !document.getElementById('dock').classList.contains('readonly')){
      var v = btn.dataset.v !== undefined ? (isNaN(btn.dataset.v)?btn.dataset.v:Number(btn.dataset.v)) : undefined;
      haptic(btn.dataset.action === 'volume_up' || btn.dataset.action === 'volume_down' ? 'step' : 'tap');
      doAction(btn.dataset.action, v, btn);
      return;
    }
    var opener = e.target.closest('[data-open]');
    if(opener && !document.getElementById('dock').classList.contains('readonly')){
      haptic('tap');
      openSheet(opener.dataset.open);
      return;
    }
    if(e.target.id === 'moreSheet'){ closeSheet(); }
  });
}
function btnHtml(action, label, icon){
  return '<button class="dockBtn" data-action="'+action+'" title="'+label+'">'+icon+'<span>'+label+'</span></button>';
}
function appBtnHtml(key, label){
  return '<button class="dockBtn appBtn" data-action="app" data-v="'+key+'" data-app="'+key+'">'+brandSwatch(key)+'<span>'+label+'</span></button>';
}
function liveBtnHtml(){ return '<button class="dockBtn appBtn" data-action="live" data-app="live">'+brandSwatch('live')+'<span>Live TV</span></button>'; }
function consoleBtnHtml(){ return '<button class="dockBtn appBtn" data-action="input" data-v="3" data-app="console">'+brandSwatch('console')+'<span>Console</span></button>'; }

function renderDock(){
  var dock = document.getElementById('dock');
  var ro = (S.mode !== 'live');
  dock.classList.toggle('readonly', ro);
  document.getElementById('roDockMsg').style.display = ro ? '' : 'none';
  ['dockPower','dockVol','dockApps','dockExtra'].forEach(function(id){
    document.getElementById(id).style.display = ro ? 'none' : 'flex';
  });
  if(ro) return;

  var tv = S.tv || {};
  var matchedKey = tv.app ? appKeyFromPkg(tv.app) : null;
  var screenIsApp = tv.screen === 'app';
  document.querySelectorAll('.appBtn').forEach(function(b){
    var isLiveTile = b.dataset.app === 'live';
    var active = matchedKey ? (b.dataset.app === matchedKey) : (isLiveTile && screenIsApp);
    b.classList.toggle('active', active);
  });
  var vol = tv.volume, max = tv.volMax || 60;
  var pct = (vol!==undefined && max) ? Math.round((vol/max)*100) : 0;
  document.getElementById('volBarFill').style.width = pct+'%';
  var volLabelEl = document.getElementById('volLabel');
  if(tv.muted){ volLabelEl.textContent = 'Muted'; volLabelEl.dataset.cnt = ''; }
  else if(vol !== undefined){ animateCount(volLabelEl, vol, '/'+max, 180); }
  else { volLabelEl.textContent = '—'; volLabelEl.dataset.cnt = ''; }

  var lightsBtn = document.getElementById('lightsBtn');
  if(S.lights && S.lights.known){
    lightsBtn.classList.toggle('active', !!S.lights.on);
  }
}
function appKeyFromPkg(pkg){
  if(!pkg) return null;
  if(pkg.indexOf('netflix')>=0) return 'netflix';
  if(pkg.indexOf('youtube')>=0) return 'youtube';
  if(pkg.indexOf('spotify')>=0) return 'spotify';
  if(pkg.indexOf('amazon')>=0 || pkg.indexOf('prime')>=0) return 'prime';
  return null;
}

/* ---------- Action dispatch with pending/confirm ---------- */
var pendingTimers = new WeakMap(); // btnEl -> array of timeout ids (double-tap keeps every pending timer, not just the latest)
function doAction(a, v, btnEl){
  if(S.mode !== 'live'){ return; }
  if(btnEl){
    btnEl.classList.add('pending');
    var timeout = setTimeout(function(){
      btnEl.classList.remove('pending');
      haptic('error');
      showToast("didn't reach the TV");
    }, 2500);
    var arr = pendingTimers.get(btnEl) || [];
    arr.push(timeout);
    pendingTimers.set(btnEl, arr);
  }
  var body = {a:a};
  if(v !== undefined) body.v = v;
  fetch('/api/do', {
    method:'POST',
    headers:{'Content-Type':'application/json','X-Harry':'1'},
    body: JSON.stringify(body),
    signal: AbortSignal.timeout(6000)
  }).then(function(r){ return r.json(); }).then(function(res){
    if(btnEl){
      var arr = pendingTimers.get(btnEl) || [];
      arr.forEach(function(t){ clearTimeout(t); });
      pendingTimers.set(btnEl, []);
      btnEl.classList.remove('pending');
    }
    if(res && res.ok && res.state){ haptic('confirm'); onLiveState(res.state); }
    else if(res && res.ok===false){ haptic('error'); showToast(res.error || "didn't reach the TV"); }
  }).catch(function(){
    haptic('error');
    showToast("didn't reach the TV");
  });
}

/* ---------- More / scenes sheet ---------- */
function openSheet(which){
  var panel = document.getElementById('sheetPanel');
  if(which === 'scenes'){
    panel.innerHTML = sheetHeadHtml('Scenes') +
      '<div class="sheetSection"><div class="pillRow">' +
      ['movie','study','winddown','morning'].map(function(s){
        return '<button class="pillBtn" data-action="scene" data-v="'+s+'">'+sceneLabel(s)+'</button>';
      }).join('') + '</div></div>';
  } else {
    var brightness = (S.lights && S.lights.brightness) || 50;
    panel.innerHTML = sheetHeadHtml('More') +
      '<div class="sheetSection"><div class="sheetLabel">HDMI input</div><div class="pillRow">' +
      [1,2,3,4].map(function(i){ return '<button class="pillBtn" data-action="input" data-v="'+i+'">HDMI '+i+'</button>'; }).join('') +
      '</div></div>' +
      '<div class="sheetSection"><div class="sheetLabel">Ambilight</div>' +
      '<div class="ambiLabel">'+(S.ambi&&S.ambi.label?esc(S.ambi.label):'Ambilight off')+'</div>' +
      '<div class="scrollChips">' + AMBI_STYLES.map(function(s){
        var sel = (S.ambi && S.ambi.style===s) ? ' selected' : '';
        return '<button class="chipBtn'+sel+'" data-action="ambilight_style" data-v="'+esc(s)+'">'+esc(s)+'</button>';
      }).join('') + '</div>' +
      '<div class="ambiNote">takes a few seconds</div>' +
      '</div>' +
      '<div class="sheetSection"><button class="pillBtn" data-action="spotify_night">Spotify, then night</button></div>' +
      '<div class="sheetSection"><div class="sheetLabel">Brightness</div><div class="sliderRow">' +
      '<input type="range" min="1" max="100" value="'+brightness+'" id="brightSlider">' +
      '<span class="sliderValue" id="brightValue">'+brightness+'</span>' +
      '</div></div>' +
      '<div class="sheetSection"><div class="sheetLabel">Room colour</div><div class="swatchRow">' +
      SWATCH_ORDER.map(function(c){
        var sel = currentRoomName()===c ? ' selected' : '';
        return '<button class="swatch'+sel+'" style="background:'+ROOM_COLOURS[c]+'" data-action="lights_colour" data-v="'+c+'"></button>';
      }).join('') + '</div></div>' +
      goveeScenesHtml() +
      remotePadHtml();
    var slider = panel.querySelector('#brightSlider');
    var brightValue = panel.querySelector('#brightValue');
    var lastStep = Number(slider.value);
    slider.addEventListener('input', function(){
      brightValue.textContent = slider.value;
      var step = Number(slider.value);
      if(step !== lastStep){ haptic('step'); lastStep = step; }
    });
    slider.addEventListener('change', function(){ doAction('lights_brightness', Number(slider.value)); });
  }
  var sheetEl = document.getElementById('moreSheet');
  sheetEl.classList.remove('closing');
  sheetEl.classList.add('open');
  requestAnimationFrame(rebuildGlassMask);
}

function sheetHeadHtml(title){

}
function sceneLabel(s){ return {movie:'Movie',study:'Study',winddown:'Wind down',morning:'Morning'}[s]||s; }
function closeSheet(){
  var sheetEl = document.getElementById('moreSheet');
  if(!sheetEl.classList.contains('open')) return;
  sheetEl.classList.add('closing');
  sheetEl.classList.remove('open');
  setTimeout(function(){
    sheetEl.classList.remove('closing');
    requestAnimationFrame(rebuildGlassMask);
  }, REDUCED_MOTION ? 0 : 200);
}
document.addEventListener('click', function(e){
  if(e.target.id === 'sheetDone') { haptic('tap'); closeSheet(); }
});

/* Swipe-down on the sheet panel to close it (touch only, transform-only drag feedback) */
(function wireSheetSwipe(){
  var panel = document.getElementById('sheetPanel');
  var startY = null, curDelta = 0, dragging = false;
  panel.addEventListener('touchstart', function(e){
    if(e.touches.length !== 1) return;
    startY = e.touches[0].clientY; dragging = true; curDelta = 0;
    panel.style.transition = 'none';
  }, {passive:true});
  panel.addEventListener('touchmove', function(e){
    if(!dragging || startY === null) return;
    var dy = e.touches[0].clientY - startY;
    if(dy < 0) dy = 0;
    curDelta = dy;
    panel.style.transform = 'translateY(' + dy + 'px)';
  }, {passive:true});
  panel.addEventListener('touchend', function(){
    if(!dragging) return;
    dragging = false;
    panel.style.transition = '';
    panel.style.transform = '';
    if(curDelta > 80) closeSheet();
    startY = null;
  });
})();

/* ================= Glass mask (single backdrop-filter, clipped to cards) ================= */
function roundRectPath(x,y,w,h,r){
  r = Math.min(r, w/2, h/2);
  return 'M'+(x+r)+','+y+
    ' H'+(x+w-r)+' A'+r+','+r+' 0 0 1 '+(x+w)+','+(y+r)+
    ' V'+(y+h-r)+' A'+r+','+r+' 0 0 1 '+(x+w-r)+','+(y+h)+
    ' H'+(x+r)+' A'+r+','+r+' 0 0 1 '+x+','+(y+h-r)+
    ' V'+(y+r)+' A'+r+','+r+' 0 0 1 '+(x+r)+','+y+' Z';
}
function rebuildGlassMask(){
  var sheet = document.getElementById('glassSheet');
  // The More sheet panel is a .glass element that now stays in flow (visibility:hidden,
  // not display:none) so it can transition — exclude it from the blur clip while closed,
  // or the backdrop-filter would blur an invisible rect at the bottom of the screen.
  var els = Array.prototype.slice.call(document.querySelectorAll('.glass')).filter(function(el){
    return getComputedStyle(el).visibility !== 'hidden';
  });
  var path = els.map(function(el){
    var r = el.getBoundingClientRect();
    if(r.width<1 || r.height<1) return '';
    var radius = parseFloat(getComputedStyle(el).borderRadius) || 22;
    return roundRectPath(r.left, r.top, r.width, r.height, radius);
  }).filter(Boolean).join(' ');
  if(path){
    sheet.style.clipPath = 'path("'+path+'")';
    sheet.style.webkitClipPath = 'path("'+path+'")';
    sheet.style.display = '';
  } else {
    sheet.style.display = 'none';
  }
}

/* ================= Toast ================= */
var toastTimer = null;
function showToast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2000);
}

/* ================= Helpers ================= */
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

document.addEventListener('DOMContentLoaded', boot);
if(document.readyState !== 'loading') boot();

})();
